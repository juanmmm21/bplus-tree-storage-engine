[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "bplus-tree-storage-engine-native"
version = "0.2.0"
description = "Optional Rust (PyO3) accelerator for the page codec of bplus-tree-storage-engine."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]

[tool.maturin]
module-name = "bplus_tree_native"
features = ["pyo3/extension-module"]
